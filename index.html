<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出海网络环境纯净度检测 & 资产避坑指南</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --card-inner: #1c2742;
            --danger: #ef4444;
            --success: #10b981;
            --primary: #38bdf8;
            --accent: #f59e0b;
            --text: #f8fafc;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 18px 14px; min-height: 100vh; }
        .container { max-width: 520px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .title { font-size: 21px; font-weight: 800; color: #fff; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: var(--text-sub); }
